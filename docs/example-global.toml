# 全局默认配置示例。复制到 ~/.config/cwrap/global.toml
# 优先级：全局 < 应用(~/.config/cwrap/apps/<app>.toml) < 命令行 FLAG
# 列表字段在合并时累加并去除完全重复的值；标量字段非空覆盖

app = "demo"
# home = "/srv/sandbox/demo"

# 权限（全部默认为空 = 零权限）
share = ["network"]          # network, ipc
socket = ["x11", "wayland"]  # x11, wayland, pulseaudio, pipewire, cups, pcsc, ssh-agent
device = []                  # dri, kvm, all
allow = []                   # devel, multiarch
fs = []                      # "rw:/path", "ro:/path"
dbus = [
  # "session.talk=org.freedesktop.Notifications",
  # "session.own=org.example.Demo",
  # "system.talk=org.freedesktop.UPower",
]
seccomp = "medium"           # low | medium | high
allow_syscalls = []
env = []

# /tmp 处理（默认 tmpfs：全空临时目录）
# tmp = "tmpfs"           # tmpfs(默认，全空) | host(宿主 /tmp)
